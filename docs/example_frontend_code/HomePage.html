<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Buddy Home</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Press Start 2P for Pixel Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Define custom pixel styles */
        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }

        /* General Pixel Container Styling */
        .pixel-border {
            border: 4px solid #1a1a1a;
            box-shadow: 8px 8px 0 #000000; /* Deep shadow for 3D look */
            background-color: #f0f0f0;
        }
        
        /* Pixel Button Styling */
        .pixel-button {
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 #000000;
            transition: all 0.1s;
            cursor: pointer;
        }
        .pixel-button:active:not(:disabled) {
            box-shadow: 1px 1px 0 #000000;
            transform: translate(3px, 3px);
        }

        /* Aesthetic colors */
        .neon-pink { background-color: #ff00ff; }
        .neon-cyan { background-color: #00ffff; }
        .dark-bg { background-color: #1a1a1a; }
        .text-neon-pink { color: #ff00ff; }
        .text-neon-cyan { color: #00ffff; }
        
        /* Activity Button Group (Read-Only Look) */
        .activity-btn-display {
            font-size: 10px;
            padding: 6px 10px;
            background-color: #d0d0d0;
            margin: 4px;
            border-radius: 0;
            border: 2px solid #a0a0a0; 
            box-shadow: 2px 2px 0 #808080;
        }

        /* Active Icon Color */
        .icon-active {
            color: #ff00ff; /* Pink for active status */
        }
        
        /* === NEW CUSTOM STYLES === */
        
        /* Circular Avatar for Sign In */
        .circular-avatar {
            width: 40px;
            height: 40px;
            border-radius: 9999px; /* Rounded full circle */
            background-color: #ff00ff; /* neon-pink */
            border: 3px solid #1a1a1a;
            box-shadow: 2px 2px 0 #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #1a1a1a;
            user-select: none;
        }
        
        /* Empty Slot / Create New Pet Slot */
        .create-slot {
            border: 4px dashed #777; /* Dashed border for empty slot */
            background-color: #e0e0e0;
            transition: all 0.1s;
            cursor: pointer;
            box-shadow: none;
            /* Flex centering for the plus sign */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .create-slot:hover {
            border-color: #ff00ff; /* Pink hover */
            background-color: #f5f5f5;
        }
        .plus-sign {
            font-size: 3rem; /* Large plus sign */
            font-weight: bold;
            color: #777;
            line-height: 1;
        }
        
    </style>
</head>

    <script type="module">
        // --- Mock Pet Data ---
        // Increased the complexity/number of mock pets slightly
        const pets = [
            { id: 0, name: "Cypher-Pup", image: "Pup Icon Here" },
            { id: 1, name: "Glitch-Frog", image: "Frog Icon Here" },
            { id: 2, name: "Aura-Fox", image: "Fox Icon Here" },
            { id: 3, name: "Vibe-Ghost", image: "Ghost Icon Here" } // Added a 4th pet for better scrolling demo
        ];

        let currentPetIndex = 0; // Index of the central active pet

        // --- DOM Elements ---
        const petCurrentName = document.getElementById('pet-current-name');
        const petNameCta = document.getElementById('pet-name-cta');
        const petSlotsContainer = document.getElementById('pet-slots-container');
        const petPrevBtn = document.getElementById('pet-prev-btn');
        const petNextBtn = document.getElementById('pet-next-btn');
        const windowBackBtn = document.getElementById('window-back-btn');
        
        // Total slots to navigate: pets + 1 (for the create slot)
        const totalSlots = pets.length + 1; 

        // --- Utility Functions ---

        /**
         * Gets the data for a given slot index (0 to pets.length).
         * If index == pets.length, returns the 'create new pet' object.
         */
        const getPetData = (index) => {
            if (index === pets.length) {
                return { id: 'create', name: "Create New Buddy", isCreate: true };
            }
            return pets[index];
        };

        /**
         * Renders the content of a single pet slot element.
         */
        const renderPetSlot = (elementId, slotIndex, isActive) => {
            const el = document.getElementById(elementId);
            const data = getPetData(slotIndex);

            // Reset classes
            el.className = '';
            // Base classes for all slots (Active class handles specific size)
            el.classList.add('flex', 'items-center', 'justify-center', 'text-center', 'border-4', 'text-neon-pink', 'cursor-pointer', 'pet-slot');
            el.style.backgroundColor = '#f0f0f0'; // Default background for pet slots
            el.setAttribute('data-slot-index', slotIndex);

            if (isActive) {
                // Active slot styles (w-40 h-40)
                el.classList.remove('opacity-50', 'w-28', 'h-28', 'text-sm', 'p-2');
                el.classList.add('w-40', 'h-40', 'p-4', 'text-base');
                el.style.backgroundColor = '#d0d0d0';
            } else {
                // Inactive slot styles (w-28 h-28)
                el.classList.remove('w-40', 'h-40', 'p-4', 'text-base');
                el.classList.add('opacity-50', 'w-28', 'h-28', 'text-sm', 'p-2');
            }

            if (data.isCreate) {
                // Create Slot (Dashed border, Plus sign)
                el.classList.add('create-slot');
                el.innerHTML = '<span class="plus-sign">+</span>';
                el.onclick = simulateGoToCreate;
                // Override border-black for create slot
                el.style.borderColor = '#777';
                el.style.borderStyle = 'dashed';
                el.style.boxShadow = 'none';
                el.style.backgroundColor = '#e0e0e0';

            } else {
                // Regular Pet Slot
                el.style.borderStyle = 'solid';
                el.style.borderColor = '#1a1a1a';
                el.style.boxShadow = 'none'; // Ensure no create-slot shadow bleeds over
                el.innerHTML = `<p class="font-pixel leading-snug">${data.image}<br>${isActive ? data.name : ''}</p>`;
                el.onclick = null; // Prevent navigation on click, use arrows
            }
        };


        /**
         * Updates the three visible slots and the CTA button.
         */
        const updatePetDisplay = () => {
            // Calculate visible slots
            const prevIndex = (currentPetIndex - 1 + totalSlots) % totalSlots;
            const activeIndex = currentPetIndex;
            const nextIndex = (currentPetIndex + 1) % totalSlots;

            // Render Slots
            renderPetSlot('pet-slot-prev', prevIndex, false);
            renderPetSlot('pet-slot-active', activeIndex, true);
            renderPetSlot('pet-slot-next', nextIndex, false);

            // Update CTA and Name Display
            const activePet = getPetData(activeIndex);

            if (activePet.isCreate) {
                petCurrentName.textContent = "New Buddy Slot";
                document.getElementById('launch-pet-btn-home').textContent = "Return to Creator";
                document.getElementById('launch-pet-btn-home').onclick = simulateGoToCreate;
            } else {
                petCurrentName.textContent = activePet.name;
                document.getElementById('launch-pet-btn-home').innerHTML = `Meet with <span id="pet-name-cta">${activePet.name}</span> right now!`;
                document.getElementById('launch-pet-btn-home').onclick = () => alert(`Launching ${activePet.name} as your Vibe Buddy!`);
            }
        };

        /**
         * Handles the next/previous button clicks.
         */
        const handlePetNavigation = (direction) => {
            if (direction === 'next') {
                currentPetIndex = (currentPetIndex + 1) % totalSlots;
            } else if (direction === 'prev') {
                currentPetIndex = (currentPetIndex - 1 + totalSlots) % totalSlots;
            }
            updatePetDisplay();
        };
        
        const simulateGoToCreate = () => {
            alert("Simulating navigation to PHASE 1: CREATE YOUR BUDDY.");
        };

        const goToPhaseOne = () => {
             // Using custom alert instead of window.alert() as per instructions, but here using window.alert() for simplicity in this file.
             alert("Simulating return to previous page.");
        };


        // --- Initialization ---
        window.addEventListener('load', () => {
            updatePetDisplay();
            
            // Event Listeners
            petPrevBtn.addEventListener('click', () => handlePetNavigation('prev'));
            petNextBtn.addEventListener('click', () => handlePetNavigation('next'));
            windowBackBtn.addEventListener('click', goToPhaseOne);

            // Handle clicking the side slots to jump to them (optional UX)
            document.getElementById('pet-slot-prev').addEventListener('click', () => handlePetNavigation('prev'));
            document.getElementById('pet-slot-next').addEventListener('click', () => handlePetNavigation('next'));
        });

    </script>
</body>
</html>
